# Карта переименования контейнеров.
# Формат строки:   исходное_имя = маскирующее_имя
# Пустые строки и всё после # игнорируются.
#
# Слева — как контейнер называется СЕЙЧАС (видно в `docker ps`).
# Справа — нейтральное имя, под которым он будет показываться хостингу.
#
# Имена подобраны под обычный веб-стек, чтобы не выдавать VPN.

remnanode            = app-backend
remnawave-node-agent = app-worker
caddy-selfsteal      = web-frontend
