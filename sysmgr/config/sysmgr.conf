#
# Здесь лежат все настройки. Редактируй их, чтобы настроить
# "Решалу" под себя, не трогая основной код.
#

# --- Общие настройки ---
readonly LOGFILE="/var/log/sysmgr.log"
readonly INSTALL_PATH="/usr/local/bin/sysmgr"
readonly FLEET_DATABASE_FILE="${HOME}/.sysmgr_fleet" # Файл с базой данных серверов "Скайнета"

# --- Обновление ОТКЛЮЧЕНО (вендоренная замороженная копия) ---
# Самообновление снято намеренно: код целиком в репозитории, внешних
# зависимостей нет. URL'ы пустые, чтобы ничего не тянулось извне. Обновлять —
# пересняв код вручную. (SKYNET авто-деплой на новый сервер из GitHub тоже выкл.)
readonly REPO_BRANCH=""
readonly REPO_OWNER=""
readonly REPO_NAME=""
readonly REPO_URL=""
readonly SCRIPT_URL_RAW=""
readonly INSTALLER_URL_RAW=""

# --- Настройки "Скайнета" ---
# Имена SSH ключей, которые будут генерироваться.
readonly SKYNET_MASTER_KEY_NAME="id_ed25519_sysmgr_master"
readonly SKYNET_UNIQUE_KEY_PREFIX="id_ed25519_sysmgr_node_"

# Дефолтные значения для добавления нового сервера.
readonly SKYNET_DEFAULT_USER="root"
readonly SKYNET_DEFAULT_PORT="22"

# --- Настройки Speedtest ---
# ID сервера Ookla Speedtest по умолчанию (Beeline Moscow).
readonly SPEEDTEST_DEFAULT_SERVER_ID="16976"

# --- Настройки Dashboard ---
# Максимальная ширина колонок в инфо-панели, чтобы не ехала вёрстка.
readonly DASHBOARD_LABEL_WIDTH=20
# TTL кэша основных метрик дашборда (в секундах)
readonly DASHBOARD_CACHE_TTL=60
# TTL кэша виджетов дашборда (в секундах)
# Виджеты часто ходят в сеть/докер, поэтому лучше не обновлять их слишком часто.
# 60 секунд — хороший баланс между актуальностью и нагрузкой.
readonly DASHBOARD_WIDGET_CACHE_TTL=120
SKYNET_AUTO_SSH_SCAN="on"
ENABLED_WIDGETS="01_crypto_price.sh"
TG_TOKEN=""
TG_CHAT_ID=""
TG_BOT_TOKEN=""
TG_CHAT_ID_DEFAULT=""
TG_TOPIC_ID_DEFAULT=""
DASHBOARD_LOAD_PROFILE="ultra_light"
DEBUG_MODE="off"
LAST_UPLOAD_SPEED="5"
LAST_VPN_CAPACITY="1 (Упор в Канал)"

# --- Настройки модуля VPN Gateway ---
# Абсолютный путь к проекту gateway, который будет управляться из решалы.
VPN_GATEWAY_MODULE_PROJECT_DIR="${SCRIPT_DIR}/modules/vpn_gateway/project"
# Относительный путь до управляющего скрипта внутри проекта gateway.
VPN_GATEWAY_MODULE_CTL_RELATIVE="scripts/gatewayctl.sh"
F2B_BANTIME="60"
F2B_MAXRETRY="3"
F2B_FINDTIME="600"
